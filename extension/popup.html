<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Alibasa</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="ui.css"><script src="theme.js"></script></head>
<body><main class="popup">
<header class="brand"><img class="mark" src="icons/icon-48.png" width="36" height="36" alt=""><div class="brand-name"><h1>Alibasa</h1><small data-i18n="tagline"></small></div></header>
<div class="field"><label for="appLanguage" data-i18n="appLanguage"></label><select id="appLanguage"></select></div>
<div class="field"><label for="theme" data-i18n="theme"></label><select id="theme"><option value="system" data-i18n="themeSystem">System</option><option value="light" data-i18n="themeLight">Light</option><option value="dark" data-i18n="themeDark">Dark</option></select></div>
<div class="field"><label for="provider" data-i18n="provider"></label><select id="provider"></select></div>
<div class="row languages"><div><label for="source" data-i18n="from"></label><select id="source"></select></div><div><label for="target" data-i18n="to"></label><select id="target"></select></div></div>
<div class="translate-actions"><button id="page" class="primary full"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v16H4zM8 9h8M8 13h5M8 17h3"/></svg><span data-i18n="page"></span></button><button id="selection" class="full"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 12h8M12 8v8"/></svg><span data-i18n="selection"></span></button></div>
<p class="hint" data-i18n="selectionHint"></p>
<div class="row secondary-actions"><button id="stop" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6h12v12H6z"/></svg><span data-i18n="stop"></span></button><button id="restore" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span data-i18n="restore"></span></button></div>
<div class="preferences">
<label class="check"><input id="bilingual" type="checkbox" aria-describedby="modeHint"><span data-i18n="bilingual"></span></label>
<label class="check"><input id="dynamic" type="checkbox" aria-describedby="dynamicHint modeHint"><span data-i18n="dynamic"></span></label>
<small id="modeHint" class="check-hint"></small>
<small id="dynamicHint" class="check-hint" data-i18n="dynamicHint"></small>
<label class="check"><input id="fallback" type="checkbox"><span data-i18n="fallback"></span></label>
</div>
<button id="overlayToggle" class="overlay-toggle" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.8 5.3A10.8 10.8 0 0 1 12 5c6 0 10 7 10 7a19 19 0 0 1-3.2 3.8M6.4 6.4A20 20 0 0 0 2 12s4 7 10 7a11 11 0 0 0 5-1.3"/></svg><span data-i18n="hideOverlay"></span></button>
<div class="row utilities"><button id="test" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 12l2 2 4-4M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg><span data-i18n="test"></span></button><button id="clear" class=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg><span data-i18n="clear"></span></button></div>
<p id="error" class="danger" role="alert" hidden></p>
</main><script type="module" src="popup.js"></script></body></html>
